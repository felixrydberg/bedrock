name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # librocksdb-sys (B-05) generates its bindings with bindgen, which needs libclang.
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Simulation build (B-23a): RocksDB is compiled out, so no libclang. rustdoc needs the cfg too, or doctests build
  # `bedrock-lib` without it against madsim-built dependencies.
  madsim:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg madsim -D warnings
      RUSTDOCFLAGS: --cfg madsim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: madsim
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
