name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep native build artifacts from consuming runner disk before S3 test service setup.
          cache-targets: false
      # librocksdb-sys (B-05) generates its bindings with bindgen, which needs libclang.
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      # S3 client contract tests (B-07) run against SeaweedFS, as in deploy/docker-compose.local.yml. Service containers
      # cannot pass the `server -s3` command, so it starts here.
      - run: docker run -d --name bedrock-s3 -p 8333:8333 chrislusf/seaweedfs:4.01 server -s3 -dir=/data -volume.max=16
      - name: Prepare S3 contract test bucket
        run: |
          deadline=$((SECONDS + 90))
          until curl --fail --silent --max-time 5 -X PUT http://127.0.0.1:8333/bedrock-test ||
                curl --fail --silent --max-time 5 -I http://127.0.0.1:8333/bedrock-test; do
            if (( SECONDS >= deadline )); then
              echo "::error::SeaweedFS could not create the test bucket"
              docker logs bedrock-s3
              exit 1
            fi
            sleep 1
          done
          until curl --fail --silent --max-time 5 -X PUT --data-binary ready http://127.0.0.1:8333/bedrock-test/.ready; do
            if (( SECONDS >= deadline )); then
              echo "::error::SeaweedFS could not write the readiness object"
              docker logs bedrock-s3
              exit 1
            fi
            sleep 1
          done
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          BEDROCK_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          BEDROCK_TEST_S3_BUCKET: bedrock-test

  # Simulation build (B-23a): RocksDB is compiled out, so no libclang. rustdoc needs the cfg too, or doctests build
  # `bedrock-lib` without it against madsim-built dependencies.
  madsim:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg madsim -D warnings
      RUSTDOCFLAGS: --cfg madsim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: madsim
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
