name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # librocksdb-sys (B-05) generates its bindings with bindgen, which needs libclang.
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      # S3 client contract tests (B-07) run against SeaweedFS, as in deploy/docker-compose.local.yml. Service containers
      # cannot pass the `server -s3` command, so it starts here; it is up long before the tests are built.
      - run: docker run -d -p 8333:8333 chrislusf/seaweedfs:4.01 server -s3 -dir=/data
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          BEDROCK_TEST_S3_ENDPOINT: http://127.0.0.1:8333
