name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # librocksdb-sys (B-05) generates its bindings with bindgen, which needs libclang.
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev
      # S3 client contract tests (B-07) run against SeaweedFS, as in deploy/docker-compose.local.yml. Service containers
      # cannot pass the `server -s3` command, so it starts here.
      - run: docker run -d -p 8333:8333 chrislusf/seaweedfs:4.01 server -s3 -dir=/data -volume.max=16
      - name: Wait for SeaweedFS S3 gateway
        run: |
          if ! timeout 60s bash -c 'until curl --fail --silent --output /dev/null --max-time 2 http://127.0.0.1:8333; do sleep 1; done'; then
            echo "::error::SeaweedFS S3 gateway at http://127.0.0.1:8333 did not respond within 60 seconds"
            exit 1
          fi
      - name: Create S3 contract test bucket
        run: |
          curl --fail --silent --show-error --max-time 10 -X PUT http://127.0.0.1:8333/bedrock-test
          curl --fail --silent --show-error --max-time 10 -X PUT --data-binary ready http://127.0.0.1:8333/bedrock-test/.ready
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          BEDROCK_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          BEDROCK_TEST_S3_BUCKET: bedrock-test

  # Simulation build (B-23a): RocksDB is compiled out, so no libclang. rustdoc needs the cfg too, or doctests build
  # `bedrock-lib` without it against madsim-built dependencies.
  madsim:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: --cfg madsim -D warnings
      RUSTDOCFLAGS: --cfg madsim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: madsim
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
