[workspace]
resolver = "3"
members = ["crates/*", "tests/sim"]

[workspace.package]
# Matches deploy/Dockerfile; resolver 3 picks dependency versions that support it.
rust-version = "1.92"

[workspace.dependencies]
bedrock-lib = { path = "crates/lib" }
figment = { version = "0.10.19", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
# madsim shims re-export the real crates in normal builds and simulate them under `--cfg madsim` (B-23a).
tokio = { package = "madsim-tokio", version = "0.2.30", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { package = "madsim-tonic", version = "0.6" }
tonic-prost = "0.14"
prost = "0.14"
aws-sdk-s3 = { package = "madsim-aws-sdk-s3", version = "0.5" }
# B-07 object checksums.
sha2 = "0.10"
base64 = "0.22"
madsim = "0.2.34"
# B-05; compiled out under madsim. Building it needs libclang (bindgen).
rocksdb = { version = "0.25", default-features = false, features = ["lz4", "bindgen-runtime"] }
tempfile = "3"
tracing = "0.1"
# B-03 admin endpoint: hyper runs over madsim-tokio sockets, so it is simulated too.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
prometheus-client = "0.25"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(madsim)"] }
