# B-23a I/O rules: shared-core code goes through the runtime (madsim-tokio) so one seed reproduces a run.
# Adapter code that must touch the OS opts out with `#[allow(clippy::disallowed_methods)]` (or `_types`) and a comment.

disallowed-methods = [
    { path = "std::time::Instant::now", reason = "use tokio::time::Instant (simulated under madsim)" },
    { path = "std::time::SystemTime::now", reason = "use the runtime clock; only adapters read wall time" },
    { path = "std::thread::spawn", reason = "use tokio::spawn (simulated under madsim)" },
    { path = "std::thread::sleep", reason = "use tokio::time::sleep" },
    { path = "rand::thread_rng", reason = "use the runtime's seeded RNG", allow-invalid = true },
    { path = "rand::rng", reason = "use the runtime's seeded RNG", allow-invalid = true },
    { path = "rand::random", reason = "use the runtime's seeded RNG", allow-invalid = true },
    { path = "std::net::TcpListener::bind", reason = "use tokio::net or the transport (simulated under madsim)" },
    { path = "std::net::TcpStream::connect", reason = "use tokio::net or the transport (simulated under madsim)" },
    { path = "std::net::UdpSocket::bind", reason = "use tokio::net (simulated under madsim)" },
    { path = "std::fs::read", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::read_to_string", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::read_dir", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::write", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::create_dir", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::create_dir_all", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::remove_file", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::remove_dir_all", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::rename", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::copy", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::metadata", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::remove_dir", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::read_link", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::canonicalize", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::set_permissions", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::symlink_metadata", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::hard_link", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::exists", reason = "filesystem access belongs in storage adapters" },
    { path = "std::path::Path::exists", reason = "filesystem access belongs in storage adapters" },
    { path = "std::path::Path::try_exists", reason = "filesystem access belongs in storage adapters" },
    { path = "std::path::Path::is_file", reason = "filesystem access belongs in storage adapters" },
    { path = "std::path::Path::is_dir", reason = "filesystem access belongs in storage adapters" },
    { path = "std::path::Path::is_symlink", reason = "filesystem access belongs in storage adapters" },
    { path = "std::path::Path::metadata", reason = "filesystem access belongs in storage adapters" },
    { path = "std::path::Path::symlink_metadata", reason = "filesystem access belongs in storage adapters" },
    { path = "std::path::Path::read_dir", reason = "filesystem access belongs in storage adapters" },
    { path = "std::path::Path::read_link", reason = "filesystem access belongs in storage adapters" },
    { path = "std::path::Path::canonicalize", reason = "filesystem access belongs in storage adapters" },
    # madsim does not simulate tokio::fs; it is the real filesystem in both builds. Paths resolve once a crate enables tokio's `fs`/`process`.
    { path = "tokio::fs::read", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::read_to_string", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::read_dir", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::write", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::create_dir", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::create_dir_all", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::remove_file", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::remove_dir", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::remove_dir_all", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::rename", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::copy", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::metadata", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::symlink_metadata", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::canonicalize", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::read_link", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::set_permissions", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::hard_link", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::try_exists", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
]

disallowed-types = [
    { path = "std::fs::File", reason = "filesystem access belongs in storage adapters" },
    { path = "std::fs::OpenOptions", reason = "filesystem access belongs in storage adapters" },
    { path = "tokio::fs::File", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "tokio::fs::OpenOptions", reason = "filesystem access belongs in storage adapters", allow-invalid = true },
    { path = "std::thread::Builder", reason = "use tokio::spawn (simulated under madsim)" },
    { path = "std::process::Command", reason = "processes are not simulated; keep them out of the shared core" },
    { path = "tokio::process::Command", reason = "processes are not simulated; keep them out of the shared core", allow-invalid = true },
    { path = "std::collections::HashMap", reason = "iteration order is random; use BTreeMap, or #[allow] with a comment when order never reaches output" },
    { path = "std::collections::HashSet", reason = "iteration order is random; use BTreeSet, or #[allow] with a comment when order never reaches output" },
]
