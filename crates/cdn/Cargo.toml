[package]
name = "bedrock-cdn"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
bedrock-lib.workspace = true
bytes = "1"
prost.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tonic.workspace = true
tracing.workspace = true

# Foyer runs real threads and files, and native S3 I/O stays outside simulation (B-23a), as in `bedrock-volume`.
[target.'cfg(not(madsim))'.dependencies]
# The version `bedrock-volume` already builds.
foyer = "0.22.6"
object_store.workspace = true
tonic-prost.workspace = true

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = { package = "madsim-tonic-build", version = "0.6" }

[features]
# The in-memory `artifact_storage::Memory` for tests outside this crate; production builds leave it out.
test-support = []

[dev-dependencies]
tempfile.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
