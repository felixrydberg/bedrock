[package]
name = "bedrock-lib"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
figment.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
prometheus-client.workspace = true
prost.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# RocksDB runs real threads and files, so simulation builds use the in-memory engine (B-23a).
# The simulated S3 SDK lacks conditional writes and checksums, so simulation builds use the in-memory store (B-07).
# In normal builds the shim re-exports the real `aws-sdk-s3`.
[target.'cfg(not(madsim))'.dependencies]
aws-sdk-s3.workspace = true
base64.workspace = true
rocksdb.workspace = true

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = { package = "madsim-tonic-build", version = "0.6" }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }

[lints]
workspace = true
