[package]
name = "bedrock-lib"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
figment.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
prometheus-client.workspace = true
prost.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# RocksDB runs real threads and files, so simulation builds use the in-memory engine (B-23a).
# Native object I/O stays outside simulation; namespace I/O uses its deterministic adapter model.
[target.'cfg(not(madsim))'.dependencies]
tonic-prost.workspace = true
slatedb.workspace = true
object_store.workspace = true
rocksdb.workspace = true

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = { package = "madsim-tonic-build", version = "0.6" }

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }

[lints]
workspace = true
