[package]
name = "bedrock-lib"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
figment.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client"] }
hyper-util.workspace = true
prometheus-client.workspace = true
prost.workspace = true
serde.workspace = true
# B-18b introspection JSON.
serde_json = "1"
sha2.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tonic.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# RocksDB runs real threads and files, so simulation builds use the in-memory engine (B-23a).
# Native object I/O stays outside simulation; namespace I/O uses its deterministic adapter model.
[target.'cfg(not(madsim))'.dependencies]
tonic-prost.workspace = true
slatedb.workspace = true
object_store.workspace = true
percent-encoding = "2"
rocksdb.workspace = true
# B-55 node mTLS. aws-lc-rs is the provider object_store's rustls already builds.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tokio-rustls = { version = "0.26", default-features = false }
tower-service = "0.3"
x509-parser = "0.18"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = { package = "madsim-tonic-build", version = "0.6" }

[features]
# Compiles simulated storage for tests outside this crate; production builds leave it out.
test-support = []

[dev-dependencies]
# Integration tests link the library without `cfg(test)`.
bedrock-lib = { path = ".", features = ["test-support"] }
tokio-stream = { version = "0.1", features = ["net"] }
figment = { workspace = true, features = ["test"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }

# Test CAs for the B-55 TLS tests, which do not run under madsim.
[target.'cfg(not(madsim))'.dev-dependencies]
rcgen = "0.14"

[lints]
workspace = true
