// Shared replication events and multiplexed relay sessions (B-10/B-17/B-18).
syntax = "proto3";
package bedrock.replication;

// `kv.md` §8. No value means DELETE.
message Event {
  string dataset = 1;
  string namespace = 2;
  string stream = 3;
  uint64 sequence = 4;
  uint64 epoch = 5;
  uint64 committed_at = 6;
  bytes key = 7;
  optional bytes value = 8;
}

message Ack {
  string dataset = 1;
  string namespace = 2;
  uint64 applied = 3;
}

// V1 relay session. Tier rank: leaf=0, cell=1, dc=2,
// region=3, writer=4. Zero on Welcome is invalid.
// A kv/cdn process's leaf session carries its membership entry (B-12).
message Hello { uint32 version = 1; uint32 tier = 2; Member member = 3; }

// B-12 cell membership entry, published under dataset `membership`, namespace `{service}.{cell}`.
// Budgets of zero mean unlimited.
message Member {
  enum Status { READY = 0; DRAINING = 1; LEFT = 2; }
  string node_id = 1;
  string service = 2;
  string region = 3;
  string dc = 4;
  string cell = 5;
  repeated string roles = 6;
  repeated string datasets = 7;
  double cpus = 8;
  uint64 memory_mb = 9;
  uint64 disk_mb = 10;
  string failure_domain = 11;
  // LEFT is relay-local: a draining node closed its stream and is removed without grace.
  Status status = 12;
  string address = 13;
}
// B-16 L2 placement directory entry, under key `range/{start}` (16 lowercase hex digits) in the same namespace as
// `Member`. The range ends where the next starts, or at 2^64.
message Range {
  message Owner {
    enum State { POPULATING = 0; READY = 1; LEAVING = 2; }
    string node_id = 1;
    State state = 2;
  }
  repeated Owner owners = 1;
}
message Follow {
  string dataset = 1;
  string namespace = 2;
  uint64 from = 3;
  repeated uint32 buckets = 4;
}
message Unfollow { string dataset = 1; string namespace = 2; }
message Recover {
  Follow follow = 1;
  repeated string visited = 2;
}
message RelayRequest {
  oneof kind {
    Hello hello = 1;
    Follow follow = 2;
    Ack ack = 3;
    Unfollow unfollow = 4;
    Recover recover = 5;
    bool progress = 6;
    // Same node as Hello; changes only its status.
    Member member = 7;
  }
}
message Welcome { uint32 version = 1; uint32 tier = 2; }
message Delivery {
  string dataset = 1;
  string namespace = 2;
  uint64 from = 3;
  uint64 through = 4;
  repeated bytes events = 5;
}
message ReplayRange {
  string dataset = 1;
  string namespace = 2;
  uint64 first = 3;
  uint64 last = 4;
  uint64 head = 5;
  bool recovered = 6;
}
message StateEntry { bytes key = 1; bytes value = 2; }
// Begin/end delimit a sorted, checksummed live-key view. Entries carry no tombstones.
message Bootstrap {
  string dataset = 1;
  string namespace = 2;
  uint64 boundary = 3;
  uint64 committed_at = 4;
  bool begin = 5;
  bool end = 6;
  repeated StateEntry entries = 7;
  bytes checksum = 8;
}
message RelayError {
  string dataset = 1;
  string namespace = 2;
  uint32 code = 3;
  string detail = 4;
}
message RelayFrame {
  oneof kind {
    Welcome welcome = 1;
    Delivery delivery = 2;
    ReplayRange range = 3;
    Bootstrap bootstrap = 4;
    RelayError error = 5;
    bool tick = 6;
  }
}
service Relay { rpc Session(stream RelayRequest) returns (stream RelayFrame); }

// Sibling relays (`replay_peers`) watch each other: a snapshot completed by `synced`, then changes.
// An empty update is a progress tick. A relay shares only what its own sessions hold, never what it
// learned from a sibling. B-12 shares leaf members; #41 / B-12b adds subscriber interests.
message SiblingWatch {}
message SiblingUpdate {
  repeated Member members = 1;
  // Only service and node_id are set.
  repeated Member members_removed = 2;
  bool synced = 3;
}
service Siblings { rpc Watch(SiblingWatch) returns (stream SiblingUpdate); }
