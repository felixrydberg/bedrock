syntax = "proto3";
import "replication.proto";

// Actor storage on `bedrock-volume` (#111 / S-03, `statefull/v2.md` §5, `docs/spec/volume.tla`). A holder (a Compute
// host) reserves an epoch at a quorum of the actor's three slots, claims with it and appends; each slot fsyncs before
// it answers. Slots compare a holder as (cell, host).
package bedrock.volume;

service Volume {
  // Accepted only above the slot's highest reservation, and fsynced before the answer (#131 / S-02b).
  rpc Reserve(ReserveRequest) returns (Answer);
  // Accepted only above the slot's promise, at its topology version or newer, and while no other holder's lease is live.
  rpc Claim(ClaimRequest) returns (Answer);
  // Written only at the slot's promise (epoch and holder), after the slot's log matches up to `prev`.
  rpc Append(AppendRequest) returns (Answer);
  // An append whose last entry is the `RELEASE` entry. After it, a new claim needs no lease wait.
  rpc Release(AppendRequest) returns (Answer);
  // One per Compute host per second, not one per actor: the lease of every actor the host holds here.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
  rpc Read(ReadRequest) returns (ReadReply);
  rpc Scan(ScanRequest) returns (ScanReply);
  // The claimant's recovery read: the slot's log after its flushed point, only for the holder it promised.
  rpc Log(LogRequest) returns (LogReply);
  // From the maintainer once S3 holds everything through `through` (S-05).
  rpc Truncate(TruncateRequest) returns (Answer);
  // A new range owner, or a slot repairing after losing its data, copies one hash range's records (S-06).
  rpc Repair(RepairRequest) returns (RepairReply);
  // A DC change or restore (S-17, `docs/spec/volume_dc.tla`): starts the actor on this slot of its new DC at the
  // flushed `MOVE` entry, or the restored point. Accepted only on a slot holding nothing of the actor, or the same import.
  rpc Import(ImportRequest) returns (Answer);
}

// `kind` is a `bedrock_lib::actors::Kind`, used only as a metrics label.
message Actor { string namespace = 1; string id = 2; int32 kind = 3; }
message Holder { string cell = 1; string host = 2; }

message Change { bytes key = 1; optional bytes value = 2; }
// Sets the actor's alarm, or clears it without `at_ms`.
message Alarm { optional uint64 at_ms = 1; }

// One commit. `committed_at` is the writer's, carried unchanged through every hop.
message Entry {
  enum Kind {
    DATA = 0;
    // A claim's first entry at its epoch (Raft's Figure 8 rule).
    NOOP = 1;
    RELEASE = 2;
    // The actor moved to another DC (S-17). Like `RELEASE`, a new claim needs no lease wait after it; a claimant that
    // recovers it never serves, and may only commit `MOVE` again.
    MOVE = 3;
    // Deletes the actor (S-05b, #137). A slot that learns it committed keeps only a tombstone; a claimant that recovers
    // it never serves, and may only commit `DELETE` again.
    DELETE = 4;
  }
  uint64 seq = 1;
  uint64 epoch = 2;
  uint64 committed_at = 3;
  Kind kind = 4;
  // The `Changes` batch `NamespaceDatabase::write` takes; the slot never reads the keys.
  repeated Change changes = 5;
  optional Alarm alarm = 6;
}

message LogEnd { uint64 seq = 1; uint64 epoch = 2; }

message ReserveRequest { Actor actor = 1; uint64 epoch = 2; uint64 version = 3; }
message ClaimRequest { Actor actor = 1; Holder holder = 2; uint64 epoch = 3; uint64 version = 4; }
// `entries` are consecutive from `prev + 1`; `prev_epoch` is the epoch of the holder's entry `prev` (0 when `prev` is 0).
// `commit` is the holder's commit point: its last entry of its own epoch acknowledged at a quorum.
message AppendRequest {
  Actor actor = 1;
  Holder holder = 2;
  uint64 epoch = 3;
  uint64 version = 4;
  uint64 prev_epoch = 5;
  repeated Entry entries = 6;
  uint64 commit = 7;
}

// Why a slot refused; `NONE` means accepted.
enum Refusal {
  NONE = 0;
  // The epoch is not above the slot's reservation (Reserve) or promise (Claim).
  STALE_EPOCH = 1;
  // The request's topology version is older than the slot's.
  STALE_VERSION = 2;
  // Another holder's lease is live; `slot.holder` names it.
  LEASE_LIVE = 3;
  // The append is not at the slot's promise.
  NOT_PROMISED = 4;
  // The slot's log does not hold the holder's entry `prev`; resend from `slot.end` or earlier.
  LOG_GAP = 5;
  // A repaired slot takes no reservation.
  NOT_VOTING = 6;
  // The slot has not caught up with `min_seq`, or `through` is past its commit point.
  BEHIND = 7;
  // The actor is moving into this slot's DC and the slot has not been imported yet (S-17).
  NOT_IMPORTED = 8;
  // The actor is deleted: the slot holds its tombstone, and nothing else of it (S-05b).
  DELETED = 9;
}

// The slot's state after the request.
message Slot {
  // False for a repaired slot: its answers count towards no reservation, claim or commit quorum.
  bool voting = 1;
  uint64 reserved = 2;
  // The promise.
  uint64 epoch = 3;
  Holder holder = 4;
  uint64 version = 5;
  LogEnd end = 6;
  uint64 committed = 7;
  // The log starts after this sequence; S3 holds everything up to it.
  uint64 flushed = 8;
  bool released = 9;
  // The epoch of entry `flushed`, so a claimant that recovers from this slot can send a lagging slot the entry after it
  // (#112 / S-04).
  uint64 flushed_epoch = 10;
  // The first `MOVE` of the actor's log, once the slot truncated it: the actor moved to another DC there (S-17).
  // Every import starts at this point, which is the same on every slot.
  LogEnd moved = 11;
  // The alarm as of `flushed`, which a DC change imports with the `MOVE` (S-17).
  optional uint64 flushed_alarm_ms = 12;
  // Where the slot was imported into the actor's new DC, if it was (S-17).
  Import imported = 13;
  // The committed `DELETE`, once the slot holds the actor's tombstone (S-05b).
  LogEnd deleted = 14;
}

message Answer { Refusal refused = 1; Slot slot = 2; }

// `ended`: claims this host stopped running the actor at, without a committed `RELEASE`, sent until acknowledged.
message HeartbeatRequest { Holder holder = 1; repeated Ended ended = 2; }
// A claim at `epoch` whose holder no longer runs the actor: its lease is over (`Live` in `docs/spec/volume.tla`).
message Ended { Actor actor = 1; uint64 epoch = 2; }
// `ended`: the endings this slot recorded, or has no use for (not its range, buried, or an older epoch); the host
// resends the others.
message HeartbeatReply { repeated Ended ended = 1; }

message ReadRequest { Actor actor = 1; repeated bytes keys = 2; uint64 min_seq = 3; }
// `value` is absent when the key is deleted or was never written.
message Value { bytes key = 1; optional bytes value = 2; }
message ReadReply { Answer answer = 1; repeated Value values = 2; }

message ScanRequest { Actor actor = 1; bytes start = 2; uint32 limit = 3; uint64 min_seq = 4; }
message ScanReply { Answer answer = 1; repeated Value values = 2; bool more = 3; }
// Entries from `from` (or the first one after the flushed point), at most `limit`.
message LogRequest { Actor actor = 1; Holder holder = 2; uint64 epoch = 3; uint64 from = 4; uint32 limit = 5; }
message LogReply { Answer answer = 1; repeated Entry entries = 2; bool more = 3; }

message TruncateRequest { Actor actor = 1; uint64 through = 2; }
// The actor's state starts at `seq`, whose entry has `epoch`, with `alarm_ms` as of there (S-17).
message ImportRequest { Actor actor = 1; uint64 epoch = 2; uint64 seq = 3; optional uint64 alarm_ms = 4; uint64 version = 5; }
// An import's point, kept apart from the slot's live state so a repeated import is recognised after claims moved on.
message Import { uint64 epoch = 1; uint64 seq = 2; optional uint64 alarm_ms = 3; }

// Records whose hash lies in `[start, end)`, `end` 0 meaning 2⁶⁴, after the raw key `after`. With `seal` (a range
// handoff) the answering node must be the range's `leaving` owner, and it first seals the span: from then on it refuses
// reservations, claims and appends there, so the copy holds every promise it gave.
message RepairRequest { uint64 start = 1; uint64 end = 2; bytes after = 3; uint32 limit = 4; bool seal = 5; }
message Record { bytes key = 1; bytes value = 2; }
// `repaired`: the parts of the span where an actor the node has no record of starts repaired (S-06).
message RepairReply { repeated Record records = 1; bool more = 2; repeated HashSpan repaired = 3; }
// `[start, end)` of the hash space, `end` 0 meaning 2⁶⁴.
message HashSpan { uint64 start = 1; uint64 end = 2; }

// Stored records (`crates/volume/src/store.rs`).
message ClaimRecord {
  uint64 epoch = 1;
  Holder holder = 2;
  bool released = 3;
  uint64 version = 4;
  // The highest reserved epoch. A repaired slot votes again once a claim above it has committed.
  uint64 reserved = 5;
  bool repaired = 6;
  uint64 committed = 7;
  LogEnd end = 8;
  uint64 flushed = 9;
  uint64 flushed_epoch = 10;
  optional uint64 alarm_ms = 11;
  // The alarm as of `flushed`, which a log truncation falls back to.
  optional uint64 flushed_alarm_ms = 12;
  int32 kind = 13;
  // The first `MOVE`, once truncated here (S-17).
  LogEnd moved = 14;
  // Where the slot was imported into the actor's new DC (S-17).
  Import imported = 15;
  // The log's first `DELETE`, until it commits or is truncated as an old epoch's tail (S-05b).
  LogEnd deleting = 16;
  // The tombstone: the committed `DELETE`. The slot then holds no log, overlay or alarm of the actor.
  LogEnd deleted = 17;
  // The `DELETE`'s `committed_at`, where the grace period starts.
  uint64 deleted_at_ms = 18;
  // Claims at or above the promise that their holder said it stopped running the actor at, some possibly before the
  // claim arrived here: while the promise is one of them, its lease is over. Lowest epoch first.
  repeated Ending ended = 19;
}
message Ending { uint64 epoch = 1; Holder holder = 2; }
message OverlayRecord { uint64 seq = 1; optional bytes value = 2; }

// An event for an actor (#116 / S-08, `statefull/v2.md` §6). A Compute host's Worker binding sends it to its cell
// Gateway; the entry Gateway routes it through the target DC's Gateways (the target cell in `bedrock-cell` metadata) to
// the cell Gateway, which delivers it to a Compute host. The host's `Acquire` serves, claims and wakes, or redirects.
// Routing is only a hint: the volume's epochs and leases keep one writer (B-66).
service Actors {
  rpc Invoke(InvokeRequest) returns (InvokeReply);
}

// `host`: the Compute node a cell Gateway should deliver to, when the sender knows the holder; empty picks the wake host.
message InvokeRequest {
  Actor actor = 1; bytes payload = 2; string host = 3;
  // An alarm Wake, distinct from an opaque request. Compute validates it under the input gate.
  optional uint64 alarm_ms = 4;
  // Exactly one of a socket event, an alarm, or an opaque payload. The holder's normal event gate runs all three.
  optional SocketEvent socket = 5;
}
// `holder` served the event, or with `redirect` holds the actor live elsewhere and `payload` is empty. A nonzero `code`
// (a gRPC code, with `message`) is the host's failure: the event ran or may have, so it is an answer, never re-sent. Only
// failures before a host took the event are gRPC errors, which Gateways may retry elsewhere.
message InvokeReply { Holder holder = 1; bool redirect = 2; bytes payload = 3; int32 code = 4; string message = 5; }

// S-15: the actor persists this reference; live transport and attachments stay at this Gateway.
message SocketConnection { string id = 1; bedrock.replication.Member gateway = 2; }
message SocketFrame { bytes data = 1; bool text = 2; }
message SocketClose { uint32 code = 1; string reason = 2; }
message SocketEvent {
  enum Kind { OPEN = 0; MESSAGE = 1; CLOSE = 2; ERROR = 3; }
  SocketConnection connection = 1;
  Kind kind = 2;
  SocketFrame frame = 3;
  SocketClose close = 4;
}
message SocketEffect {
  string id = 1;
  oneof action { SocketFrame send = 2; bytes attachment = 3; SocketClose close = 4; }
}
enum SocketOutcome { ACCEPTED = 0; MISSING = 1; OVERLOADED = 2; UNAVAILABLE = 3; UNCERTAIN = 4; STALE = 5; }
message SocketResult { string id = 1; SocketOutcome outcome = 2; string detail = 3; }
message SocketReport { repeated SocketResult results = 1; }
message SocketLookup { Actor actor = 1; repeated string ids = 2; }
message SocketSnapshot { string id = 1; SocketOutcome outcome = 2; bytes attachment = 3; }
message SocketSnapshots { repeated SocketSnapshot sockets = 1; }
message SocketApply {
  Actor actor = 1;
  // Existing volume writer epoch, followed by a monotonically increasing event number in that awake instance.
  // Gateways reject older/duplicate callbacks; there is no retry or durable delivery log.
  uint64 epoch = 2;
  uint64 event = 3;
  repeated SocketEffect effects = 4;
}
service Sockets {
  rpc Lookup(SocketLookup) returns (SocketSnapshots);
  rpc Apply(SocketApply) returns (SocketReport);
}
