node_id = "api-1"
listen = "0.0.0.0:7000"
# The address relays dial, as their upstreams list it.
advertise = "api.core:7000"
admin_listen = "0.0.0.0:7001"
write_listen = "0.0.0.0:7002"
# Required via BEDROCK_WRITE_TOKEN. Clients send Authorization: Bearer <token>.
# This credential grants PUT and DELETE access to all datasets/namespaces; use a random secret and a trusted network
# or a TLS-terminating proxy for the HTTP write endpoint.
data_dir = "/data"

# Credentials come from BEDROCK_S3__ACCESS_KEY_ID and BEDROCK_S3__SECRET_ACCESS_KEY.
# SlateDB requires get, list, conditional put and delete permissions.
[s3]
endpoint = "https://s3.example.internal"
bucket = "bedrock"

[location]
region = "core"
dc = "arn2"
cell = "core-1a"

# Writes acknowledge only after events, values, retries and progress are durable together.
# Expiry cleanup is event-triggered; idle physical cleanup may wait.
# Open SlateDB handles retain internal engine timers; Bedrock does not poll idle namespaces.
[retention]
event_retention_ms = 86400000
retry_retention_ms = 86400000

# Mutual TLS between nodes (B-55); unset means plaintext. Issuing the files: docs/deployment/security.md.
# The certificate needs a DNS SAN for api.core, the host in advertise and in API clients' write endpoints.
# [tls]
# cert = "/etc/bedrock/tls/tls.crt"
# key = "/etc/bedrock/tls/tls.key"
# ca = "/etc/bedrock/tls/ca.crt"
