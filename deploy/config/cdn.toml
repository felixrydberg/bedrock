node_id = "eu-1a-m1"
listen = "0.0.0.0:7200"
# Published in the cell membership entry so peers can dial this node.
advertise = "eu-1a-m1:7200"
admin_listen = "0.0.0.0:7201"
data_dir = "/data"
roles = ["l1", "l2"]
datasets = ["cdn"]
relays = ["relay-eu-1a-1:7300", "relay-eu-1a-2:7300", "relay-eu-1a-3:7300"]
api = "api.core:7002"
s3_endpoint = "https://s3.example.internal"

[location]
region = "eu"
dc = "eu-1"
cell = "eu-1a"

[budget]
cpus = 2.0
memory_mb = 4096
disk_mb = 102400

# The node follows all `cdn` retention metadata, every namespace, without configuration (#22 / B-21).

# Mutual TLS between nodes (B-55); unset means plaintext. Issuing the files: docs/deployment/security.md.
# [tls]
# cert = "/etc/bedrock/tls/tls.crt"
# key = "/etc/bedrock/tls/tls.key"
# ca = "/etc/bedrock/tls/ca.crt"
