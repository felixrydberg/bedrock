node_id = "eu-1a-m1"
listen = "0.0.0.0:7100"
# Published in the cell membership entry so peers can dial this node.
advertise = "eu-1a-m1:7100"
admin_listen = "0.0.0.0:7101"
data_dir = "/data"
roles = ["l1", "l2"]
# Customer KV has no relay-fed datasets or subscriptions; the relays carry only its membership.
relays = ["relay-eu-1a-1:7300", "relay-eu-1a-2:7300", "relay-eu-1a-3:7300"]
api = "api.core:7002"
s3_endpoint = "https://s3.example.internal"

[location]
region = "eu"
dc = "eu-1"
cell = "eu-1a"

[budget]
cpus = 2.0
memory_mb = 4096
disk_mb = 102400
