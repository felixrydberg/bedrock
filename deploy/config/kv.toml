node_id = "eu-1a-m1"
listen = "0.0.0.0:7100"
# Published in the cell membership entry so peers can dial this node.
advertise = "eu-1a-m1:7100"
admin_listen = "0.0.0.0:7101"
data_dir = "/data"
roles = ["l1", "l2"]
# Customer KV has no relay-fed datasets; the relays carry only its membership.
relays = ["relay-eu-1a-1:7300", "relay-eu-1a-2:7300", "relay-eu-1a-3:7300"]
api = "api.core:7002"
s3_endpoint = "https://s3.example.internal"
# Required: Authorization: Bearer <write_token> for value writes and forwards between kv nodes, and the bedrock-api
# write credential this node forwards directory writes with. Set it via BEDROCK_WRITE_TOKEN. Value writes
# (Cloudflare's /client/v4/accounts/{tenant}/storage/kv/namespaces/{id}/values/{key}, /bulk and /bulk/delete) are served
# on `listen`, where other kv nodes forward them.
# Namespace management and the value routes for clients; unset serves none.
# manage_listen = "0.0.0.0:7103"

# The bucket namespace databases live in. This node writes and reads the namespaces it owns (#58 / B-26).
# Credentials come from BEDROCK_S3__ACCESS_KEY_ID and BEDROCK_S3__SECRET_ACCESS_KEY, with get, list, conditional put
# and delete.
[s3]
endpoint = "https://s3.example.internal"
bucket = "bedrock"

[location]
region = "eu"
dc = "arn1"
cell = "eu-1a"

# Other cells: new namespaces are placed in a cell of their jurisdiction, and writes for another cell's namespaces are
# forwarded to its entry address (a kv node's `listen`, or its Gateway once B-57 exists).
# [cells.eu-1b]
# region = "eu"
# address = "eu-1b-m1:7100"

[budget]
cpus = 2.0
memory_mb = 4096
disk_mb = 102400

# Mutual TLS between nodes (B-55); unset means plaintext. Issuing the files: docs/deployment/security.md.
# [tls]
# cert = "/etc/bedrock/tls/tls.crt"
# key = "/etc/bedrock/tls/tls.key"
# ca = "/etc/bedrock/tls/ca.crt"
